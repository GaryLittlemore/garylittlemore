
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">

  <title>garylittlemore.uk</title>

  <style>
    /*
      CUSTOMISE YOUR PAGE HERE

      Change the background colour below.

      To use an image instead, change --page-image
      to: url("background.jpg");
    */

    :root {
      --page-background: #ffffff;
      --page-image: none;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      background-color: var(--page-background);
      background-image: var(--page-image);
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      overflow: hidden;
    }
  </style>
</head>
